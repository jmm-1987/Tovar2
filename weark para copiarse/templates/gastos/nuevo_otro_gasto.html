{% extends "base.html" %}

{% block title %}Nuevo {{ nombre_tipo }} - Gastos{% endblock %}

{% block content %}
<h2>Nuevo {{ nombre_tipo }}</h2>

<form method="POST">
    <div class="form-row-compact">
        <div class="form-group-compact">
            <label for="fecha">Fecha *</label>
            <input type="date" name="fecha" id="fecha" required>
        </div>
        <div class="form-group-compact">
            <label for="importe">Importe (€) *</label>
            <input type="number" name="importe" id="importe" step="0.01" min="0" required placeholder="0.00">
        </div>
        <div class="form-group-compact">
            <label for="periodo">Período</label>
            <input type="text" name="periodo" id="periodo" placeholder="Ej: T1 2024, 01/2024">
        </div>
    </div>

    <div class="form-group">
        <label for="observaciones">Observaciones</label>
        <textarea name="observaciones" id="observaciones" rows="3" placeholder="Observaciones adicionales..."></textarea>
    </div>

    <div class="actions">
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('gastos.listado_otro_gasto', tipo_gasto=tipo_gasto) }}" class="btn btn-danger">Cancelar</a>
    </div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const today = new Date().toISOString().split('T')[0];
    const fechaInput = document.getElementById('fecha');
    if (fechaInput && !fechaInput.value) fechaInput.value = today;
});
</script>
{% endblock %}
